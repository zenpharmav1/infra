name: Terraform (AWS Emulator)

# Tests the Terraform code against AWS Emulator running on the GitHub runner.
# No AWS account, no access keys, no cost: every run starts from an empty emulator,
# runs init → validate → plan → apply → plan (must show no changes), then throws it away.

on:
  push:
    paths:
      - 'envs/dev/**'
      - 'modules/**'
      - 'ci/**'
      - '.github/workflows/terraform-emulator.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'envs/dev/**'
      - 'modules/**'
      - 'ci/**'
      - '.github/workflows/terraform-emulator.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: '1.15.6'
  EMULATOR_PORT: '9297'

concurrency:
  group: terraform-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-test:
    name: Plan & Apply on AWS Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # keep real exit codes for -detailed-exitcode

      - name: Install AWS Emulator (latest release)
        run: |
          deb=$(mktemp -d)/aws-emulator.deb
          curl -fsSLo "$deb" https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y "$deb"
          /opt/aws-emulator/bin/aws-emulator -v

      - name: Start AWS Emulator (telemetry off)
        run: |
          mkdir -p ~/.aws/emulator
          nohup /opt/aws-emulator/bin/aws-emulator -p "$EMULATOR_PORT" -t off \
            > ~/.aws/emulator/$EMULATOR_PORT.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf --cacert ~/.aws/emulator/$EMULATOR_PORT/ca.pem \
              https://127.0.0.1:$EMULATOR_PORT/__admin/health && break
            sleep 1
          done
          curl -sf --cacert ~/.aws/emulator/$EMULATOR_PORT/ca.pem \
            https://127.0.0.1:$EMULATOR_PORT/__admin/health

      - name: Point AWS CLI at the emulator
        run: |
          d=$HOME/.aws/emulator/$EMULATOR_PORT
          {
            echo "AWS_ENDPOINT_URL=https://127.0.0.1:$EMULATOR_PORT"
            echo "AWS_SHARED_CREDENTIALS_FILE=$d/emulator_credentials"
            echo "AWS_CONFIG_FILE=$d/config"
            echo "AWS_CA_BUNDLE=$d/ca.pem"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "AWS_REGION=us-east-1"
            echo "AWS_DEFAULT_REGION=us-east-1"
            echo "AWS_PAGER="
          } >> "$GITHUB_ENV"

      - name: Check we are talking to the emulator (account 000000000000)
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "Account: $account"
          test "$account" = "000000000000"

      - name: Prepare state bucket, override and test inputs
        run: |
          aws s3 mb s3://zen-pharma-terraform-state-ahmed
          cp ../../ci/emulator_override.tf ./emulator_override.tf
          # Throw-away values for this run only (the emulator is deleted when the job ends)
          db_pw="ci$(openssl rand -hex 12)"; jwt="$(openssl rand -hex 24)"
          echo "::add-mask::$db_pw"; echo "::add-mask::$jwt"
          echo "TF_VAR_db_password=$db_pw" >> "$GITHUB_ENV"
          echo "TF_VAR_jwt_secret=$jwt"    >> "$GITHUB_ENV"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Re-plan must show no changes
        run: terraform plan -input=false -no-color -detailed-exitcode

      - name: Summary
        if: always()
        run: |
          {
            echo "## Terraform on AWS Emulator"
            echo "- Emulator: $(/opt/aws-emulator/bin/aws-emulator -v | head -1)"
            echo "- Resources in state: $(terraform state list 2>/dev/null | wc -l)"
            echo "- EKS clusters: $(aws eks list-clusters --query clusters --output text 2>/dev/null)"
            echo "- RDS instances: $(aws rds describe-db-instances --query 'DBInstances[].[DBInstanceIdentifier,EngineVersion,DBInstanceStatus]' --output text 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show emulator log on failure
        if: failure()
        run: tail -n 100 ~/.aws/emulator/$EMULATOR_PORT.log || true

